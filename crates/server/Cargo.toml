[package]
name = "chess_server"
version = "0.1.0"
edition = "2024"
default-run = "chess_server"

[features]
export-ts = ["dep:ts-rs"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
ts-rs = { version = "12", optional = true }

[[bin]]
name = "export-ts"
path = "src/bin/export_ts.rs"
required-features = ["export-ts"]
